<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>펑펑 아레나</title>
  <meta name="description" content="링크로 모여서 펑! 최대 6명이 함께하는 3D 폭탄 아레나" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💣</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet" />
</head>
<body>
  <canvas id="game"></canvas>

  <section id="join" class="panel center hidden">
    <h1>펑펑 아레나</h1>
    <p class="sub">링크로 모여서 펑! · 최대 6명</p>
    <div class="join-body">
      <div class="preview">
        <div id="preview-stage" class="stage"></div>
        <p class="char-name" id="preview-name"></p>
        <p class="char-desc" id="preview-desc"></p>
      </div>
      <div class="join-form">
        <label class="field">닉네임<input id="name" maxlength="12" autocomplete="off" /></label>
        <p class="label">캐릭터 <span class="muted">· 외형만 다르고 능력치는 모두 같아요</span></p>
        <div class="chars cards" id="join-chars"></div>
        <button id="join-btn" class="primary" disabled>서버 연결 중…</button>
        <p class="muted">방 코드 <b id="join-room"></b></p>
      </div>
    </div>
  </section>

  <section id="lobby" class="panel side hidden">
    <div class="room-head">
      <span>방 <b id="room-code"></b></span>
      <button id="copy-btn">🔗 초대 링크 복사</button>
    </div>
    <p class="label">플레이어 <span id="count"></span></p>
    <ul id="players"></ul>
    <div class="setting-row">
      <span class="label">🤖 AI 봇</span>
      <div class="stepper" id="bot-stepper">
        <button id="bot-minus" aria-label="봇 줄이기">−</button>
        <b id="bot-count">0</b>
        <button id="bot-plus" aria-label="봇 늘리기">+</button>
      </div>
    </div>
    <div class="setting-row">
      <span class="label">모드</span>
      <div class="seg" id="mode-seg">
        <button data-mode="solo">개인전</button>
        <button data-mode="team">팀전 🫧</button>
      </div>
    </div>
    <p class="muted mode-hint" id="mode-hint"></p>
    <div class="setting-row">
      <span class="label">🏆 세트</span>
      <div class="seg" id="sets-seg">
        <button data-sets="1">1판</button>
        <button data-sets="2">3판 2선승</button>
        <button data-sets="3">5판 3선승</button>
      </div>
    </div>
    <div class="team-pick hidden" id="team-pick">
      <span class="label">내 팀</span>
      <div class="seg">
        <button data-team="0">A팀</button>
        <button data-team="1">B팀</button>
      </div>
    </div>
    <p class="label">내 캐릭터</p>
    <div class="chars cards small" id="lobby-chars"></div>
    <p class="label">맵 <span class="muted" id="map-hint"></span></p>
    <div id="maps" class="maps"></div>
    <p class="map-desc muted" id="map-desc"></p>
    <p class="help">이동 <kbd>←↑↓→</kbd> <kbd>WASD</kbd> · 폭탄 <kbd>Space</kbd> · 채팅 <kbd>Enter</kbd><br />
      ⚽ 축구화: 폭탄 쪽으로 걸으면 차기 · 🧤 글러브: 폭탄 위에서 <kbd>Space</kbd> 한 번 더 → 던지기</p>
    <div class="lobby-actions">
      <button id="start-btn" class="primary">게임 시작</button>
      <p id="wait-msg" class="muted"></p>
    </div>
  </section>

  <section id="hud" class="hidden">
    <div id="timer"></div>
    <div id="setbar" class="hidden"></div>
    <ul id="alive"></ul>
    <div id="mystats"></div>
  </section>

  <div id="banner" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <div id="status" class="hidden"></div>
  <div id="chat" class="hidden">
    <ul id="chat-log"></ul>
    <input id="chat-input" class="hidden" maxlength="80" autocomplete="off" placeholder="메시지 입력 후 Enter · 취소 Esc" />
    <p id="chat-hint">💬 Enter로 채팅</p>
  </div>
  <div id="corner">
    <button id="sfx-btn" aria-label="효과음"></button>
    <button id="music-btn" aria-label="배경음"></button>
    <div id="ping" title="서버 왕복 시간 (낮을수록 좋음)"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
